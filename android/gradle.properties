org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Compile Kotlin inside the Gradle daemon rather than forking a second JVM,
# which would need its own heap on top of the daemon's.
kotlin.compiler.execution.strategy=in-process
# If Gradle is OOM-killed on a low-memory machine, lower -Xmx above and/or
# reduce org.gradle.workers.max to 2. Do not raise it above available RAM.
org.gradle.workers.max=4
org.gradle.parallel=true
