org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Compile Kotlin inside the Gradle daemon rather than forking a second JVM,
# which would need its own heap on top of the daemon's.
kotlin.compiler.execution.strategy=in-process
# This machine has ~7.8 GB RAM total (well under the previous -Xmx4G request,
# which let the kernel OOM-kill the build). Cap workers and avoid forking.
org.gradle.workers.max=2
org.gradle.parallel=false
